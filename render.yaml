services:
  - type: web
    name: pod-artwork-checker
    runtime: docker
    plan: starter
    healthCheckPath: /
    disk:
      name: artwork-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SCOPES
        value: read_products
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: DATABASE_URL
        fromDatabase:
          name: pod-artwork-checker-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false

databases:
  - name: pod-artwork-checker-db
    plan: basic-256mb
    databaseName: pod_artwork_checker
    user: pod_artwork_checker
